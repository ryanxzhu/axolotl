<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- The black canvas paints straight away, but text waits for Fredoka: the font downloads in the background
             while the page's text stays hidden (the fonts-loading class), then shows only once Fredoka is ready.
             If the font fails or takes over FONT_WAIT_MS, the text shows anyway so the game never stays wordless. -->
        <script>
            document.documentElement.classList.add('fonts-loading');
            const FONT_WAIT_MS = 1000;
            function showText() {
                document.documentElement.classList.remove('fonts-loading');
            }
            setTimeout(showText, FONT_WAIT_MS);
            function fontStylesheetLoaded(link) {
                link.onload = null;
                link.rel = 'stylesheet';
                document.fonts.load('700 20px Fredoka').then(showText, showText);
            }
        </script>
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
            onload="fontStylesheetLoaded(this)"
            onerror="showText()"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" />
        </noscript>
        <link rel="stylesheet" href="styles.css" />
        <script defer src="GameSettings.js"></script>
        <script defer src="utilityFunctions.js"></script>
        <script defer src="Terrain.js"></script>
        <script defer src="Meeple.js"></script>
        <script defer src="Food.js"></script>
        <script defer src="ScorePopups.js"></script>
        <script defer src="Bubbles.js"></script>
        <script defer src="BiteSounds.js"></script>
        <script defer src="Upgrades.js"></script>
        <script defer src="SaveGame.js"></script>
        <script defer src="AwayProgress.js"></script>
        <script defer src="canvas.js"></script>
        <script defer src="responsive.js"></script>
        <script defer src="main.js"></script>
        <title>Axolotl</title>
    </head>
    <body>
        <div id="container">
            <div id="canvas-container">
                <canvas></canvas>
            </div>
            <h1 id="game-title">Axolotl</h1>
            <div id="side-panel">
                <div id="calories"><span>Calories: 0</span></div>
                <div id="upgrades" hidden>
                    <div id="upgrade-buttons"></div>
                </div>
            </div>
            <button id="sound-toggle" aria-label="Turn sound off" aria-pressed="true"></button>
            <div id="away-popup" hidden aria-live="polite">
                <div class="away-title">While you were away</div>
                <div class="away-amount"></div>
            </div>
            <div id="save-controls">
                <div class="save-buttons">
                    <button id="new-game-button">New game</button>
                </div>
                <div id="save-status"></div>
            </div>
            <div id="confirm-overlay" hidden>
                <div id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
                    <button id="confirm-close" aria-label="Close">✕</button>
                    <p id="confirm-text">Are you sure? A new game will wipe your saved game</p>
                    <div class="confirm-buttons">
                        <button id="confirm-yes">Yes</button>
                        <button id="confirm-no">No</button>
                    </div>
                </div>
            </div>
            <div id="speed" hidden>Speed: 1.0</div>
            <div id="dev-stats">
                <div id="upgrade-time">Mins to buy all upgrades: –</div>
                <div id="calorie-rate">Calories/min: 0.0</div>
            </div>
            <!-- <div id="info">Upgrades1</div> -->
        </div>
    </body>
</html>
